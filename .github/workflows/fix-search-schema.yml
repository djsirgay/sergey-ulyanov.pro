name: One-time Search Console schema repair

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/fix-search-schema.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair ProfilePage and VideoObject metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("site-fragments/00-head.html")
          text = path.read_text(encoding="utf-8")

          old_date = '"dateModified":"2026-08-18"'
          new_date = '"dateModified":"2026-09-09T20:00:00-07:00"'
          if old_date not in text and new_date not in text:
              raise SystemExit("Expected ProfilePage dateModified value not found")
          text = text.replace(old_date, new_date)

          old_video = '{"@type":"VideoObject","url":"https://www.youtube.com/watch?v=bTn2yMBUBG0","name":"Targeted in His Country for Being Gay"}'
          new_video = '''{
          "@type":"VideoObject",
          "url":"https://www.youtube.com/watch?v=bTn2yMBUBG0",
          "name":"Targeted In His Country For Being Gay",
          "description":"Sergey Ulyanov shares his experience of anti-LGBTQ+ persecution in Belarus, seeking asylum, and rebuilding his life in the United States.",
          "thumbnailUrl":"https://i.ytimg.com/vi/bTn2yMBUBG0/maxresdefault.jpg",
          "uploadDate":"2024-08-22T19:00:06Z",
          "duration":"PT15M25S",
          "embedUrl":"https://www.youtube.com/embed/bTn2yMBUBG0"
        }'''
          if old_video not in text and '"uploadDate":"2024-08-22T19:00:06Z"' not in text:
              raise SystemExit("Expected VideoObject value not found")
          text = text.replace(old_video, new_video)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Rebuild and validate production HTML
        run: |
          python3 scripts/build-production.py
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("JSON-LD block not found")
          data = json.loads(match.group(1))
          graph = data["@graph"]
          profile = next(item for item in graph if item.get("@type") == "ProfilePage")
          person = next(item for item in graph if item.get("@type") == "Person")
          video = next(item for item in person["subjectOf"] if item.get("@type") == "VideoObject")
          assert "T" in profile["dateModified"]
          for field in ("name", "description", "thumbnailUrl", "uploadDate", "embedUrl"):
              assert video.get(field), field
          print("Structured data validated")
          PY

      - name: Commit repaired source and generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-fragments/00-head.html index.html
          if git diff --cached --quiet; then
            echo "No repair commit needed"
          else
            git commit -m "fix: resolve Search Console structured data warnings"
            git push
          fi

# one-time trigger

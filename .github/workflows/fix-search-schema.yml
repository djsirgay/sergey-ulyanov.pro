name: One-time Search Console schema repair

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/fix-search-schema.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair ProfilePage metadata and remove inapplicable VideoObject
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("site-fragments/00-head.html")
          text = path.read_text(encoding="utf-8")

          old_date = '"dateModified":"2026-08-18"'
          new_date = '"dateModified":"2026-09-09T20:00:00-07:00"'
          if old_date not in text and new_date not in text:
              raise SystemExit("Expected ProfilePage dateModified value not found")
          text = text.replace(old_date, new_date)

          # The homepage is a profile page, not a video watch page. Remove the
          # VideoObject instead of publishing video markup that is not visible
          # and playable on that page.
          text = re.sub(
              r',\s*\{"@type":"VideoObject","url":"https://www\.youtube\.com/watch\?v=bTn2yMBUBG0".*?"embedUrl":"https://www\.youtube\.com/embed/bTn2yMBUBG0"\}',
              '',
              text,
              flags=re.S,
          )
          text = text.replace(
              ',\n        {"@type":"VideoObject","url":"https://www.youtube.com/watch?v=bTn2yMBUBG0","name":"Targeted in His Country for Being Gay"}',
              '',
          )
          if '"@type":"VideoObject"' in text:
              raise SystemExit("VideoObject still present in homepage source")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Rebuild and validate production HTML
        run: |
          python3 scripts/build-production.py
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("JSON-LD block not found")
          data = json.loads(match.group(1))
          graph = data["@graph"]
          profile = next(item for item in graph if item.get("@type") == "ProfilePage")
          person = next(item for item in graph if item.get("@type") == "Person")
          assert "T" in profile["dateModified"]
          assert not any(item.get("@type") == "VideoObject" for item in person.get("subjectOf", []))
          print("Structured data validated")
          PY

      - name: Commit repaired source and generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-fragments/00-head.html index.html
          if git diff --cached --quiet; then
            echo "No repair commit needed"
          else
            git commit -m "fix: remove inapplicable homepage video schema"
            git push
          fi

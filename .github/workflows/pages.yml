name: Validate and deploy production portfolio

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and validate production HTML
        run: python3 scripts/build-production.py
      - name: Validate JavaScript syntax
        run: |
          node --check site.js
          node --check research/i18n.js
          node --check research/shared-language.js
          node --check research/navigation.js
          node --check research/wayfinding-pages.js
          node --check research/storage-migration.js
          node --check research/atlas/atlas.js
          node --check research/atlas/mapa/mapa.js
          node --check research/atlas/mapa/history.js
          node --check research/atlas/mapa/chronology.js
          node --check research/atlas/mapa/events.js
      - name: Verify research routes and assets
        run: node scripts/check-research.mjs
      - name: Verify research navigation, local data safety and historical maps
        run: node --test tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production HTML
        run: python3 scripts/build-production.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public artifact
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '_research-site/' \
            --exclude 'site-fragments/' \
            --exclude 'scripts/' \
            --exclude 'tests/' \
            --include 'LICENSE*.md' \
            --exclude '*.md'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Validate and deploy production portfolio

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and validate production HTML
        run: python3 scripts/build-production.py
      - name: Validate JavaScript syntax
        run: node --check site.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production HTML
        run: python3 scripts/build-production.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public artifact
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'actor-final/' \
            --exclude 'actor-final-preview/' \
            --exclude 'actor-preview/' \
            --exclude 'actor-preview-v2/' \
            --exclude 'base-site/' \
            --exclude 'refinement-preview/' \
            --exclude 'version-review/' \
            --exclude 'site-fragments/' \
            --exclude 'scripts/' \
            --exclude '*.md'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

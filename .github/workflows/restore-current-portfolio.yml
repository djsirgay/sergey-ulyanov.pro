name: Restore current portfolio while preserving actor pages

on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/restore-current-portfolio.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-recovery
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preserve the exact published revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: published
      - name: Check out the last verified current portfolio
        uses: actions/checkout@v4
        with:
          ref: 1fe0f655808b96114a7366a429cd83499420a2cd
          path: source
          persist-credentials: false
      - name: Build and validate current portfolio
        working-directory: source
        run: |
          set -euo pipefail
          python3 scripts/build-production.py
          node --check site.js
          node --check research/i18n.js
          node --check research/shared-language.js
          node --check research/navigation.js
          node --check research/wayfinding-pages.js
          node --check research/storage-migration.js
          node --check research/atlas/atlas.js
          node --check research/atlas/mapa/mapa.js
          node --check research/atlas/mapa/history.js
          node --check research/atlas/mapa/chronology.js
          node --check research/atlas/mapa/events.js
          node scripts/check-research.mjs
          node --test tests/*.test.mjs
      - name: Restore public files without deleting actor pages or assets
        run: |
          set -euo pipefail
          mkdir artifact
          rsync -a published/ artifact/ --exclude '.git/' --exclude '.github/' --exclude 'site-fragments/' --exclude 'scripts/' --exclude 'tests/' --include 'LICENSE*.md' --exclude '*.md'
          rsync -a source/ artifact/ --exclude '.git/' --exclude '.github/' --exclude '_site/' --exclude '_research-site/' --exclude 'site-fragments/' --exclude 'scripts/' --exclude 'tests/' --include 'LICENSE*.md' --exclude '*.md'
          node source/scripts/build-legacy-research-redirects.mjs --artifact "$GITHUB_WORKSPACE/artifact"
          cmp source/index.html artifact/index.html
          for route in actor-final-preview actor-final actor-preview actor-preview-v2; do
            if [ -d "published/$route" ]; then diff -qr "published/$route" "artifact/$route"; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          root = Path('artifact')
          html = (root / 'index.html').read_text()
          assert 'Ideas into' in html, 'Missing current homepage heading'
          assert 'Four views. One body of work.' in html, 'Missing current audience routes'
          assert 'document.write' not in html, 'Stale runtime loader returned'
          assert 'content="noindex"' not in html, 'Homepage remains noindex'
          class AssetCheck(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  key = 'src' if tag in ('img', 'script') else 'href' if tag == 'link' and attrs.get('rel') in ('stylesheet', 'icon', 'apple-touch-icon') else None
                  value = attrs.get(key, '') if key else ''
                  url = urlsplit(value)
                  if value and not url.scheme and not url.netloc and url.path.startswith('/'):
                      assert (root / unquote(url.path).lstrip('/')).is_file(), 'Missing asset: ' + value
          AssetCheck().feed(html)
          for route in ('hire', 'work', 'press', 'privacy', 'research'):
              assert (root / route / 'index.html').is_file(), 'Missing route: ' + route
          research = (root / 'research/index.html').read_text()
          assert 'https://research.sergey-ulyanov.pro/' in research and 'location.replace' in research
          print('Recovery checks passed: current static homepage, routes, assets, research redirect; actor trees unchanged.')
          PY
      - name: Synchronize the published branch with the verified artifact
        working-directory: published
        run: |
          set -euo pipefail
          rsync -a ../artifact/ ./
          rsync -a ../source/site-fragments ../source/scripts ../source/tests ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Restore verified current portfolio from main@1fe0f65; preserve actor pages'
            git push origin HEAD:gh-pages
          fi
          echo "RECOVERY_COMMIT=$(git rev-parse HEAD)"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the verified combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifact
      - name: Deploy the restored site
        id: deployment
        uses: actions/deploy-pages@v4

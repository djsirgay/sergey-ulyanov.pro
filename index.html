<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080a08" />
  <title>Sergéy Ulyanov — Creative Marketing & AI Workflow Strategist</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a08}
    iframe{display:block;width:100%;height:100%;border:0;background:#080a08}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#080a08;color:#b8ff35;font:700 13px/1.4 ui-monospace,monospace;letter-spacing:.12em;z-index:3}
  </style>
</head>
<body>
  <div id="loading">LOADING SERGÉY ULYANOV…</div>
  <iframe id="site" title="Sergéy Ulyanov website"></iframe>
  <script>
  (async()=>{
    const VERSION='20260729-4';
    const frame=document.getElementById('site');
    const loading=document.getElementById('loading');
    const portfolioView='https://drive.google.com/file/d/1fpVBAID1vf3_WA50vAyowC9YXSEx5uyW/view';
    const portfolioDownload='https://drive.google.com/uc?export=download&id=1fpVBAID1vf3_WA50vAyowC9YXSEx5uyW';

    function addDownloadButton(parent,after){
      if(!parent||[...parent.querySelectorAll('a')].some(a=>a.textContent.includes('Download Portfolio')))return;
      const a=parent.ownerDocument.createElement('a');
      a.className='btn';
      a.href=portfolioDownload;
      a.textContent='Download Portfolio ↓';
      if(after)after.insertAdjacentElement('afterend',a);else parent.append(a);
    }

    function patchApprovedVersion(){
      try{
        const doc=frame.contentDocument;
        if(!doc)return;

        const photo=doc.querySelector('.portrait-card img');
        if(photo){
          photo.src='/assets/sergey-headshot.webp?v='+VERSION;
          photo.style.objectPosition='center bottom';
          photo.style.filter='saturate(.96) contrast(1.02)';
          photo.style.position='absolute';
          photo.style.left='0';
          photo.style.bottom='0';
          photo.style.width='100%';
          photo.style.height='114%';
          photo.style.transform='none';
          photo.style.transformOrigin='center bottom';
        }

        const setSinglePortfolioDownload=(parent)=>{
          if(!parent)return;
          const links=[...parent.querySelectorAll('a')];
          let portfolioLink=links.find(a=>/View (Full )?Portfolio|Download Portfolio/i.test(a.textContent));
          if(!portfolioLink){
            portfolioLink=doc.createElement('a');
            portfolioLink.className='btn';
            parent.append(portfolioLink);
          }
          portfolioLink.href=portfolioDownload;
          portfolioLink.removeAttribute('target');
          portfolioLink.removeAttribute('rel');
          portfolioLink.textContent='Download Portfolio ↓';
          [...parent.querySelectorAll('a')].filter(a=>a!==portfolioLink&&/View (Full )?Portfolio|Download Portfolio/i.test(a.textContent)).forEach(a=>a.remove());
        };
        setSinglePortfolioDownload(doc.querySelector('.hero-actions'));
        setSinglePortfolioDownload(doc.querySelector('.contact-actions'));

        const mobile=doc.querySelector('.mobile-bar');
        if(mobile&&mobile.children[1]){
          mobile.children[1].href=portfolioDownload;
          mobile.children[1].removeAttribute('target');
          mobile.children[1].textContent='Portfolio ↓';
        }

        const style=doc.createElement('style');
        style.textContent=`
          .brands{padding:46px 0;background:linear-gradient(180deg,#0b0e0b,#080a08)}
          .brand-intro{width:min(var(--max),calc(100% - 48px));margin:0 auto 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
          .brand-intro strong{font-size:1rem;letter-spacing:-.02em}.brand-intro span{font-family:"Space Mono",monospace;color:#707970;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}
          .brand-mask{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
          .logo-row{display:flex;align-items:center;gap:14px;min-width:max-content;animation:logoRoll 38s linear infinite;padding:2px 0}
          .logo-card{width:214px;height:108px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));display:flex;align-items:center;justify-content:center;padding:22px 28px;transition:.25s;position:relative;overflow:hidden}
          .logo-card:hover{transform:translateY(-4px);border-color:rgba(184,255,53,.5);box-shadow:0 18px 45px rgba(0,0,0,.28)}
          .logo-card img{max-width:166px;max-height:58px;width:auto;height:auto;object-fit:contain;filter:grayscale(1) brightness(0) invert(1);opacity:.84;transition:.25s}
          .logo-card:hover img{filter:none;opacity:1}.logo-card b{font-size:1.42rem;letter-spacing:-.04em;text-align:center;color:#edf2ed}
          .logo-pair{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);align-items:center;gap:12px;width:100%;height:100%}.logo-slot{display:flex;align-items:center;justify-content:center;min-width:0;height:100%}.logo-pair img{display:block;width:100%;height:44px;max-width:82px;max-height:44px;object-fit:contain;object-position:center;transform:none!important}.logo-pair i{width:1px;height:42px;background:var(--line);justify-self:center}
          @keyframes logoRoll{to{transform:translateX(-50%)}}
          @media(max-width:640px){.brand-intro{width:calc(100% - 30px);align-items:flex-start;flex-direction:column;gap:8px}.logo-card{width:178px;height:90px;padding:18px 22px}.logo-card img{max-width:142px;max-height:48px}.logo-pair{gap:8px}.logo-pair img{height:38px;max-width:68px;max-height:38px}.logo-pair i{height:36px}}
          @media(max-width:640px){
            .portrait-card img{position:absolute!important;left:0!important;bottom:0!important;width:100%!important;height:114%!important;transform:none!important;transform-origin:center bottom!important;object-position:center bottom!important}
            #work .section-head{margin-bottom:16px}
            #work .section-head p{font-size:.82rem;line-height:1.45}
            #work .rail{grid-auto-columns:82vw;gap:12px;padding:4px 15px 18px;touch-action:pan-y pinch-zoom;scroll-padding-inline:15px}
            #work .case{scroll-snap-align:start;border-radius:22px}
            #work .case-visual{min-height:235px;padding:20px}
            #work .case-body{padding:22px 18px;gap:20px}
            #work .case h3{font-size:2.15rem;margin:12px 0}
            #work .case-body>div>p{font-size:.88rem;line-height:1.5}
            #work .impact{gap:8px;margin-top:16px}
            #work .impact div{padding:10px;border-radius:13px}
            #work .impact b{font-size:1.02rem}
            #work .impact span{font-size:.62rem}
            #work .tags{margin-bottom:12px}
            #work .tag{padding:6px 8px;font-size:.58rem}
            #work .rail-controls{padding-top:4px}
            .mobile-swipe-hint{display:flex!important}
          }
          .mobile-swipe-hint{display:none;align-items:center;justify-content:space-between;gap:12px;width:calc(100% - 30px);margin:0 auto 12px;padding:10px 13px;border:1px solid rgba(184,255,53,.25);border-radius:999px;background:rgba(184,255,53,.06);font-family:"Space Mono",monospace;font-size:.61rem;letter-spacing:.07em;color:#cbd3cb;text-transform:uppercase}
          .mobile-swipe-hint b{color:var(--acid);font-size:.68rem}
          @media(prefers-reduced-motion:reduce){.logo-row{animation:none}}
        `;
        doc.head.append(style);

        const logo=(src,alt)=>`<div class="logo-card"><img src="${src}" alt="${alt}"></div>`;
        const word=text=>`<div class="logo-card"><b>${text}</b></div>`;
        const sequence=
          logo('https://upload.wikimedia.org/wikipedia/commons/c/ce/Coca-Cola_logo.svg','Coca-Cola')+
          logo('https://upload.wikimedia.org/wikipedia/commons/3/36/McDonald%27s_Golden_Arches.svg','McDonald’s')+
          logo('https://upload.wikimedia.org/wikipedia/commons/6/6d/Volkswagen_logo_2019.svg','Volkswagen')+
          word('PARAMOUNT')+
          logo('https://upload.wikimedia.org/wikipedia/commons/c/c4/Universal_Music_Group_logo.svg','Universal Music Group')+
          logo('https://upload.wikimedia.org/wikipedia/commons/b/b9/Sony_Music_Entertainment_Logo_2023.svg','Sony Music')+
          logo('https://upload.wikimedia.org/wikipedia/commons/9/9c/BASF-Logo_bw.svg','BASF')+
          logo('https://upload.wikimedia.org/wikipedia/commons/e/ed/Logo_of_UNICEF.svg','UNICEF')+
          `<div class="logo-card"><div class="logo-pair"><span class="logo-slot"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Cal_Poly_Logo_2019.svg" alt="Cal Poly"></span><i></i><span class="logo-slot"><img src="https://upload.wikimedia.org/wikipedia/commons/9/93/Amazon_Web_Services_Logo.svg" alt="AWS"></span></div></div>`+
          logo('https://upload.wikimedia.org/wikipedia/commons/c/cb/The_Global_Fund_logo.svg','The Global Fund')+
          word('COMPLEX');

        const brandMarkup=`<div class="brand-intro"><strong>Selected brands & organizations</strong><span>Strategy · creative · digital products · AI workflows</span></div><div class="brand-mask"><div class="logo-row">${sequence+sequence}</div></div>`;
        const brands=doc.querySelector('.brands');
        if(brands){
          brands.innerHTML=brandMarkup;
          if(!doc.querySelector('.brands-top')){
            const topBrands=doc.createElement('section');
            topBrands.className='brands brands-top';
            topBrands.innerHTML=brandMarkup;
            const metricStrip=doc.querySelector('.metric-strip');
            if(metricStrip)metricStrip.insertAdjacentElement('afterend',topBrands);
          }
        }

        const workRail=doc.querySelector('#work .rail-shell');
        if(workRail&&!doc.querySelector('.mobile-swipe-hint')){
          const hint=doc.createElement('div');
          hint.className='mobile-swipe-hint';
          hint.innerHTML='<b>Swipe projects ↔</b><span>Scroll page ↓</span>';
          workRail.insertAdjacentElement('beforebegin',hint);
        }

        doc.querySelectorAll('#work .case').forEach(card=>{
          const link=card.querySelector('.case-footer a');
          if(!link)return;
          link.target='_blank';
          link.rel='noopener noreferrer';
          link.textContent='View in portfolio ↗';
          card.style.cursor='pointer';
          card.setAttribute('role','link');
          card.setAttribute('tabindex','0');
          card.setAttribute('aria-label','Open this project in the portfolio presentation');
          let startX=0,startY=0;
          card.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY},{passive:true});
          card.addEventListener('click',e=>{
            if(e.target.closest('a,button'))return;
            if(Math.hypot(e.clientX-startX,e.clientY-startY)>12)return;
            window.open(link.href,'_blank','noopener,noreferrer');
          });
          card.addEventListener('keydown',e=>{
            if(e.key==='Enter'||e.key===' '){e.preventDefault();window.open(link.href,'_blank','noopener,noreferrer')}
          });
        });

        const pressRail=doc.querySelector('[data-rail="press"]');
        if(pressRail){
          const cards=[...pressRail.children];
          const findCard=text=>cards.find(card=>card.textContent.includes(text));
          [findCard('SCREAM 7 × Complex'),findCard('Targeted in His Country'),findCard('building a career in Hollywood'),findCard('viral cultural story'),findCard('eleventh attempt'),findCard('masculinity, attraction')].filter(Boolean).forEach(card=>pressRail.append(card));
          pressRail.scrollLeft=0;
          const current=doc.querySelector('[data-current="press"]');
          const updatePressCount=()=>{
            const items=[...pressRail.children];
            let best=0,min=Infinity;
            items.forEach((item,i)=>{const distance=Math.abs(item.getBoundingClientRect().left-innerWidth*.1);if(distance<min){min=distance;best=i}});
            if(current)current.textContent=String(best+1).padStart(2,'0');
          };
          pressRail.addEventListener('scroll',()=>requestAnimationFrame(updatePressCount),{passive:true});
          updatePressCount();
        }
      }catch(error){console.error('Patch failed',error)}
    }

    try{
      const source=await fetch('/refinement-preview/index.html?v='+VERSION,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Refinement source failed');return r.text()});
      const match=[...source.matchAll(/<script>([\s\S]*?)<\/script>/g)].pop();
      if(!match)throw new Error('Refinement script not found');
      const approvedScript=match[1].replace(/const portrait='data:image\/webp;base64,[^']+';/,"const portrait='/assets/sergey-headshot.webp?v="+VERSION+"';");
      new Function(approvedScript)();
      frame.addEventListener('load',patchApprovedVersion);
      frame.addEventListener('load',()=>{if(loading)loading.remove()});
      frame.src='/base-site/index.html?v='+VERSION;
    }catch(error){
      console.error(error);
      loading.textContent='SITE COULD NOT LOAD — PLEASE REFRESH';
    }
  })();
  </script>
</body>
</html>

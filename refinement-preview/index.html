      .proof-block+.proof-block{margin-top:88px}

      .proof-rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(72vw,760px);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px max(24px,calc((100vw - var(--max))/2)) 24px;cursor:grab}

        <div class="wrap section-head reveal visible"><div><div class="eyebrow">Recognition & Press</div><h2>Proof beyond the portfolio.</h2></div><p>Awards and editorial coverage are separated into two visual galleries, with clear previews and navigation in both directions.</p></div>

function award(label,year,big,sub,meta,title,copy,source,href,cta){return `<article class="proof-card"><div class="proof-preview"><div class="preview-top"><span>${label}</span><span>${year}</span></div><div class="preview-main"><strong>${big}</strong><span>${sub}</span></div><div class="preview-bottom">${source}</div></div><div class="proof-copy"><div><div class="meta">${meta}</div><h4>${title}</h4><p>${copy}</p></div><div class="proof-footer"><span class="proof-source">${source} · ${year}</span><a class="proof-link" href="${href}" target="_blank">${cta}</a></div></div></article>`}
function press(pub,year,big,sub,meta,copy,source,href){return `<article class="proof-card press-card"><div class="proof-preview"><div class="preview-top"><span>${pub}</span><span>${year}</span></div><div class="preview-main"><strong>${big}</strong><span>${sub}</span></div><div class="preview-bottom">${source} · EDITORIAL PREVIEW</div></div><div class="proof-copy"><div><div class="meta">${meta}</div><h4>${sub}</h4><p>${copy}</p></div><div class="proof-footer"><span class="proof-source">${source} · ${year}</span><a class="proof-link" href="${href}" target="_blank">Read story ↗</a></div></div></article>`}
function setupProof(doc,name){
  const rail=doc.querySelector(`[data-proof="${name}"]`),items=[...rail.children],current=doc.querySelector(`[data-current-proof="${name}"]`);
  const go=dir=>{const w=items[0].getBoundingClientRect().width+18;rail.scrollBy({left:dir*w,behavior:'smooth'})};
  doc.querySelectorAll(`[data-prev="${name}"]`).forEach(b=>b.addEventListener('click',()=>go(-1)));doc.querySelectorAll(`[data-next="${name}"]`).forEach(b=>b.addEventListener('click',()=>go(1)));
  const update=()=>{let best=0,min=Infinity;items.forEach((item,i)=>{const d=Math.abs(item.getBoundingClientRect().left-frame.contentWindow.innerWidth*.1);if(d<min){min=d;best=i}});current.textContent=String(best+1).padStart(2,'0')};rail.addEventListener('scroll',()=>requestAnimationFrame(update),{passive:true});update();
  let down=false,x=0,s=0;rail.addEventListener('pointerdown',e=>{down=true;x=e.clientX;s=rail.scrollLeft;rail.classList.add('dragging')});rail.addEventListener('pointermove',e=>{if(down)rail.scrollLeft=s-(e.clientX-x)});['pointerup','pointercancel','pointerleave'].forEach(ev=>rail.addEventListener(ev,()=>{down=false;rail.classList.remove('dragging')}));
}
